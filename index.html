var TODAY = new Date(); TODAY.setHours(0,0,0,0);
var STALE_DAYS = 30;
function pd(s){return s? new Date(s+"T00:00:00"):null;}
function fmt(s){if(!s)return "";var d=pd(s);return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear();}
function daysTo(s){return Math.round((pd(s)-TODAY)/86400000);}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function eur(n){return Number(n).toLocaleString("it-IT",{maximumFractionDigits:0})+" €";}
function eur2(n){return Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}
function stale(r){return r.lastVerified? (TODAY-pd(r.lastVerified))/86400000>STALE_DAYS : true;}
function effStatus(r){ if(r.status==="APERTO" && (r.evidence!=="ufficiale"||stale(r))) return "DA_VERIFICARE"; return r.status; }
function stPill(key){var s=STATUS[key];return '<span class="pill '+s.c+'"><span aria-hidden="true">'+s.g+'</span>'+s.l+'</span>';}
function byId(id){for(var i=0;i<DB.length;i++)if(DB[i].id===id)return DB[i];return null;}
var SUD=["Abruzzo","Basilicata","Calabria","Campania","Molise","Puglia","Sardegna","Sicilia"];
var REGIONS=["Abruzzo","Basilicata","Calabria","Campania","Molise","Puglia","Sardegna","Sicilia","Lazio","Marche","Umbria","Toscana","Emilia-Romagna","Veneto","Lombardia","Piemonte","Altra regione Centro-Nord"];
function regionApplies(r,name){
  var R=r.regions;
  if(R.indexOf("ITALIA")>=0) return true;
  if(name==="UE") return R.indexOf("UE")>=0;
  if(R.indexOf("UE")>=0) return true;
  if(R.indexOf(name)>=0) return true;
  if(SUD.indexOf(name)>=0 && R.indexOf("SUD")>=0) return true;
  if(SUD.indexOf(name)<0 && name!=="UE" && R.indexOf("CENTRO-NORD")>=0) return true;
  return false;
}
/* Compatibilità: solo criteri espliciti. Esito per criterio: ok / miss / ver */
var profile={age:22,region:"Abruzzo",employment:"nd",company:"nd",farm:"nd",activity:"nd"};
function evalFit(r){
  var checks=[];
  var es=effStatus(r);
  checks.push({res:es==="APERTO"?"ok":(r.status==="CHIUSO"?"miss":"ver"),txt:"Misura aperta e verificata di recente",det:es==="APERTO"?"Aperta, verificata il "+fmt(r.lastVerified):(r.status==="CHIUSO"?"Risulta chiusa":"Stato non confermato o verifica oltre "+STALE_DAYS+" giorni")});
  if(profile.region==="nd") checks.push({res:"ver",txt:"Territorio",det:"Regione non indicata nel profilo"});
  else if(regionApplies(r,profile.region)) checks.push({res:"ok",txt:"Territorio",det:"Applicabile in "+profile.region});
  else checks.push({res:"miss",txt:"Territorio",det:"Non applicabile in "+profile.region+" (ambito: "+r.regions.join(", ")+")"});
  r.rules.forEach(function(u){
    var c={txt:u.txt,res:"ver",det:""};
    if(u.k==="age"){ if(profile.age===""||isNaN(profile.age)){c.det="Età non indicata";} else if(profile.age>=u.min&&profile.age<=u.max){c.res="ok";c.det="Hai "+profile.age+" anni";} else {c.res="miss";c.det="Hai "+profile.age+" anni, fuori intervallo "+u.min+"–"+u.max;} }
    else if(u.k==="employment"){ if(profile.employment==="nd")c.det="Condizione occupazionale non dichiarata"; else if(profile.employment==="occ"){c.res="miss";c.det="Occupato: la misura richiede una condizione specifica";} else {c.res="ok";c.det="Condizione dichiarata compatibile (da documentare)";} }
    else if(u.k==="company"){ if(u.need==="any"){c.res="ok";c.det="Vale sia per imprese esistenti sia da costituire";} else if(profile.company==="nd")c.det="Esistenza dell'impresa non dichiarata"; else if(profile.company==="si"){c.res="ok";c.det="Impresa dichiarata come esistente";} else {c.res="miss";c.det="Impresa non ancora costituita";} }
    else if(u.k==="farm"){ if(u.need==="any"){c.res="ver";c.det="Dipende dall'ambito del progetto";} else if(profile.farm==="nd")c.det="Status di agricoltore non dichiarato"; else if(profile.farm==="si"){c.res="ok";c.det="Azienda agricola dichiarata";} else {c.res="miss";c.det="Non sei un'azienda agricola";} }
    else if(u.k==="noagri"){ if(profile.activity==="agrivolt"||profile.farm==="si"){c.res="miss";c.det="Attività agricola/agrivoltaica dichiarata, settore escluso";} else if(profile.activity==="nd")c.det="Attività non indicata nel profilo"; else {c.res="ok";c.det="Attività non agricola";} }
    else if(u.k==="startup"){c.det="Richiede iscrizione alla sezione speciale startup: non dichiarata nel profilo";}
    else if(u.k==="compagine"){c.det=(profile.age!==""&&profile.age>=18&&profile.age<=35?"La tua età rientra in 18–35; ":"")+"dipende dalla composizione dei soci, non dichiarata";}
    else if(u.k==="isee"){c.det="ISEE non dichiarato nel profilo";}
    checks.push(c);
  });
  var o=0,m=0,v=0;checks.forEach(function(c){if(c.res==="ok")o++;else if(c.res==="miss")m++;else v++;});
  return {checks:checks,ok:o,miss:m,ver:v,total:checks.length};
}
function fitSummary(f){return f.ok+" soddisfatti, "+f.ver+" da verificare, "+f.miss+" mancanti";}
function meter(f){var t=f.total||1;return '<div class="meter" role="img" aria-label="'+esc(fitSummary(f))+'"><i class="m-ok" style="width:'+(f.ok/t*100)+'%"></i><i class="m-ver" style="width:'+(f.ver/t*100)+'%"></i><i class="m-bad" style="width:'+(f.miss/t*100)+'%"></i></div>';}
function resPill(res){return res==="ok"?'<span class="pill ok">Soddisfatto</span>':(res==="miss"?'<span class="pill bad">Mancante</span>':'<span class="pill warn">Da verificare</span>');}

var SYN={solare:"fotovoltaico",pannelli:"fotovoltaico",fv:"fotovoltaico",pv:"fotovoltaico",agrivoltaici:"agrivoltaico",giovani:"under35",youth:"under35",startup:"startup",imprese:"impresa",macchinari:"beni strumentali",tecnologia:"digitale"};
function haystack(r){return (r.name+" "+r.body+" "+r.plain+" "+r.kw+" "+r.cats.map(function(c){return catName(c);}).join(" ")+" "+r.aid.map(function(a){return AID[a];}).join(" ")+" "+r.sectors.map(function(s){return ACT[s];}).join(" ")+" "+r.benef.map(function(b){return BEN[b];}).join(" ")).toLowerCase();}
function catName(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i].n;return id;}
function score(r,q){
  if(!q.trim())return 1;
  var h=haystack(r),terms=q.toLowerCase().split(/\s+/).filter(Boolean),s=0;
  for(var i=0;i<terms.length;i++){
    var t=terms[i],alt=SYN[t];
    if(h.indexOf(t)>=0)s+=1; else if(alt&&h.indexOf(alt)>=0)s+=0.8; else return 0;
    if(r.name.toLowerCase().indexOf(t)>=0)s+=1;
  }
  return s;
}
function applyFilters(){
  var f=state.f,out=[];
  DB.forEach(function(r){
    var sc=score(r,state.q); if(!sc)return;
    if(f.cat && r.cats.indexOf(f.cat)<0)return;
    if(f.benef.length && !f.benef.some(function(b){return r.benef.indexOf(b)>=0;}))return;
    if(f.act.length && !f.act.some(function(a){return r.sectors.indexOf(a)>=0;}))return;
    if(f.aid.length && !f.aid.some(function(a){return r.aid.indexOf(a)>=0;}))return;
    if(f.reg && !regionApplies(r,f.reg))return;
    if(f.status && effStatus(r)!==f.status)return;
    if(f.dl){ if(!r.close)return; var d=daysTo(r.close); if(d<0||d>Number(f.dl))return; }
    if(f.evid && r.evidence!=="ufficiale")return;
    if(f.fp && r.aid.indexOf("fp")<0 && r.aid.indexOf("vou")<0)return;
    if(f.tz && r.aid.indexOf("tz")<0)return;
    if(f.lowcap && r.lowCapital!==true)return;
    var fit=evalFit(r);
    if(f.fit && fit.miss>0)return;
    out.push({r:r,sc:sc,fit:fit});
  });
  var rank={APERTO:0,ANNUNCIATA:1,DA_VERIFICARE:2,ATTESA_EDIZIONE:3,CHIUSO:4};
  out.sort(function(a,b){
    if(state.sort==="name")return a.r.name.localeCompare(b.r.name,"it");
    if(state.sort==="dl"){var da=a.r.close?daysTo(a.r.close):99999,db=b.r.close?daysTo(b.r.close):99999;return da-db;}
    if(state.sort==="ver"){return (b.r.lastVerified||"").localeCompare(a.r.lastVerified||"");}
    if(b.sc!==a.sc&&state.q.trim())return b.sc-a.sc;
    var ra=rank[effStatus(a.r)],rb=rank[effStatus(b.r)]; if(ra!==rb)return ra-rb;
    if(a.fit.miss!==b.fit.miss)return a.fit.miss-b.fit.miss;
    if(a.r.evidence!==b.r.evidence)return a.r.evidence==="ufficiale"?-1:1;
    return a.fit.ver-b.fit.ver;
  });
  return out;
}

function countFor(fn){return DB.filter(fn).length;}
function home(){
  var tot=DB.length;
  var off=countFor(function(r){return r.evidence==="ufficiale";});
  var open=countFor(function(r){return effStatus(r)==="APERTO";});
  var ann=countFor(function(r){return r.status==="ANNUNCIATA";});
  var att=countFor(function(r){return r.status==="ATTESA_EDIZIONE";});
  var imm=countFor(function(r){if(!r.close)return false;var d=daysTo(r.close);return d>=0&&d<=45;});
  var comp=countFor(function(r){var f=evalFit(r);return f.miss===0;});
  var anyStale=DB.some(function(r){return r.status==="APERTO"&&r.evidence==="ufficiale"&&stale(r);});

function example(r){
  var e=r.example; if(!e)return '<p class="nv">Esempio non disponibile: i dati economici non sono stati verificati.</p>';

  else if(e.kind==="loan"){var L=inv*e.pct/100;t='<p>Progetto di <b>'+eur(inv)+'</b> con finanziamento a tasso zero al <b>'+e.pct+'%</b> (massimo previsto), restituito in <b>'+e.years+' anni</b>.</p><ul><li>Finanziamento: <b>'+eur(L)+'</b></li><li>Quota non coperta: <b>'+eur(inv-L)+'</b></li><li>Rata media teorica: <b>'+eur2(L/(e.years*12))+'</b> al mese, senza interessi e senza preammortamento (piano reale <span class="nv">non verificato</span>)</li></ul>';}
  else if(e.kind==="ssi"){var L2=inv*0.8,FP=L2*0.3;t='<p>Programma di <b>'+eur(inv)+'</b> con finanziamento all\'80% (startup non maggiorata).</p><ul><li>Finanziamento a tasso zero: <b>'+eur(L2)+'</b></li><li>Se si applica il 30% a fondo perduto al finanziamento (ipotesi, base di calcolo <span class="nv">non specificata nella pagina</span>): <b>'+eur(FP)+'</b>, quindi da restituire <b>'+eur(L2-FP)+'</b></li><li>Quota non coperta: <b>'+eur(inv-L2)+'</b></li></ul>';}
  return t+'<p style="font-size:.82rem;color:var(--muted)">Calcolo illustrativo sulle percentuali lette nella pagina ufficiale. Non considera spese non ammissibili, valutazione del progetto né eventuali altre condizioni.</p>';
}
function cell(r,k,fit){
  var es=effStatus(r);
  switch(k){
   case"ente":return esc(r.body);
   case"tipo":return r.aid.map(function(a){return esc(AID[a]);}).join(", ");
   case"int":return r.intensity!=null?r.intensity+"%":'<span class="nv">non verificata</span>';
   case"max":return r.maxEur!=null?eur(r.maxEur):'<span class="nv">non verificato</span>';
   case"ben":return r.benef.map(function(b){return esc(BEN[b]);}).join(", ");
   case"reg":return esc(r.regions.join(", "));
   case"st":return stPill(es);
   case"sca":return r.close?fmt(r.close)+(r.evidence!=="ufficiale"?" (non verificata)":""):'<span class="nv">non indicata</span>';
   case"ver":return r.lastVerified?fmt(r.lastVerified):'<span class="nv">mai verificata</span>';
   case"cum":return r.cumul==="non verificato"?'<span class="nv">non verificata</span>':esc(r.cumul);
   case"dm":return r.deMinimis.indexOf("non verificato")>=0||r.deMinimis.indexOf("non indicato")>=0?'<span class="nv">'+esc(r.deMinimis)+'</span>':esc(r.deMinimis);
   case"fit":var g=function(res){return fit.checks.filter(function(c){return c.res===res;}).map(function(c){return '<li>'+esc(c.txt)+'</li>';}).join("");};
     return meter(fit)+'<p><b>'+esc(fitSummary(fit))+'</b></p>'+(g("ok")?'Soddisfatti<ul>'+g("ok")+'</ul>':'')+(g("ver")?'Da verificare<ul>'+g("ver")+'</ul>':'')+(g("miss")?'Mancanti<ul>'+g("miss")+'</ul>':'');
  }
  return "";
}

  if(state.cmp.length<2)return '<h2>Confronta misure</h2><div class="empty">Seleziona almeno 2 misure con la casella «Confronta» nei risultati. Selezionate ora: '+state.cmp.length+'.<br><br><button class="btn" data-go="search">Vai alla ricerca</button></div>';
  var rs=state.cmp.map(byId),fits=rs.map(evalFit);
  var rows=[["Ente","ente"],["Tipo di aiuto","tipo"],["Intensità massima","int"],["Importo massimo","max"],["Beneficiari","ben"],["Territorio","reg"],["Stato","st"],["Scadenza","sca"],["Ultima verifica","ver"],["Cumulabilità","cum"],["De minimis","dm"],["Compatibilità col profilo","fit"]];
  var h='<div class="sec-h"><h2>Confronto di '+rs.length+' misure</h2><button class="btn small" data-act="clearcmp">Svuota confronto</button></div><div class="twrap"><table><thead><tr><th scope="col"></th>'+rs.map(function(r){return '<th scope="col"><button class="link" data-open="'+r.id+'">'+esc(r.name)+'</button><br><button class="btn small" data-cmpdel="'+r.id+'" style="margin-top:6px">Rimuovi</button></th>';}).join("")+'</tr></thead><tbody>';
  rows.forEach(function(row){h+='<tr><th scope="row">'+row[0]+'</th>'+rs.map(function(r,i){return '<td>'+cell(r,row[1],fits[i])+'</td>';}).join("")+'</tr>';});

function pmt(P,rate,years){var n=years*12;if(!rate)return P/n;var i=rate/100/12;return P*i/(1-Math.pow(1+i,-n));}
function simCalc(s){
  var inv=Math.max(0,Number(s.inv)||0),fp=0,loan=0,notes=[];
  if(s.preset==="ras"){var capped=Math.min(inv,200000);if(inv>200000)notes.push("Importo oltre 200.000 euro: il massimo indicato dalla pagina è 200.000; il calcolo usa 200.000 come base.");var pct=capped<=120000?75:70;fp=capped*pct/100;loan=0;notes.push("Fondo perduto "+pct+"% sulla base ammissibile; la copertura della quota restante non è indicata nella pagina.");}
  else if(s.preset==="on"){loan=inv*0.9;notes.push("Finanziamento al 90% a tasso zero, 10 anni (valori massimi indicati dalla pagina). Il fondo perduto non è più previsto dal 01/07/2026.");}
  else if(s.preset==="ssi"){loan=inv*0.8;if(s.sudfp){fp=loan*0.3;notes.push("Ipotesi: 30% a fondo perduto applicato al finanziamento. La base di calcolo non è specificata nella pagina: verifica sul bando.");}notes.push("Durata del rimborso inserita da te: non indicata nella pagina.");}
  else{fp=inv*(Number(s.fp)||0)/100;loan=inv*(Number(s.loan)||0)/100;}
  if(fp+loan>inv){var k=inv/(fp+loan);fp*=k;loan*=k;notes.push("Contributo e finanziamento superano la spesa: ridotti in proporzione.");}
  var repay=loan-(s.preset==="ssi"?fp:0);
  var rate=s.preset==="on"||s.preset==="ras"||s.preset==="ssi"?0:Number(s.rate)||0;
  var years=s.preset==="on"?10:Math.max(1,Number(s.years)||1);
  var base=s.preset==="ssi"?loan-fp:loan;
  var m=base>0?pmt(base,rate,years):0;
  var own=inv-fp-loan;
  return {inv:inv,fp:fp,loan:loan,base:base,own:own,m:m,tot:m*years*12,interest:m*years*12-base,notes:notes,years:years,rate:rate};
}
function simView(){
  var s=state.sim,c=simCalc(s);
  function opt(v,l){return '<option value="'+v+'"'+(s.preset===v?' selected':'')+'>'+l+'</option>';}
  var custom=s.preset==="custom";
  var h='<h2>Simulatore economico</h2><div class="panel"><div class="formgrid">'+
   '<label class="field"><span>Schema</span><select id="m-preset">'+opt("custom","Personalizzato")+opt("ras","Resto al Sud 2.0 (percentuali lette il 20/10/2026)")+opt("on","ON, solo finanziamento (valori massimi)")+opt("ssi","Smart&Start base (80%)")+'</select></label>'+
   '<label class="field"><span>Spesa totale del progetto (€)</span><input id="m-inv" type="number" min="0" step="1000" value="'+esc(s.inv)+'"></label>'+
   (custom?'<label class="field"><span>Fondo perduto (% della spesa)</span><input id="m-fp" type="number" min="0" max="100" value="'+esc(s.fp)+'"></label><label class="field"><span>Finanziamento agevolato (% della spesa)</span><input id="m-loan" type="number" min="0" max="100" value="'+esc(s.loan)+'"></label><label class="field"><span>Tasso annuo (%)</span><input id="m-rate" type="number" min="0" step="0.1" value="'+esc(s.rate)+'"></label>':'')+
   ((custom||s.preset==="ssi")?'<label class="field"><span>Durata rimborso (anni)</span><input id="m-years" type="number" min="1" max="30" value="'+esc(s.years)+'"></label>':'')+
   (s.preset==="ssi"?'<label class="field"><span>Ipotesi fondo perduto</span><label style="display:flex;gap:8px;align-items:center"><input id="m-sudfp" type="checkbox"'+(s.sudfp?' checked':'')+'> Applica 30% al finanziamento</label></label>':'')+
   '</div></div>';
  h+='<div class="out" aria-live="polite"><div><b>'+eur(c.inv)+'</b><span>Spesa del progetto</span></div><div><b>'+eur(c.fp)+'</b><span>Fondo perduto (non si restituisce)</span></div><div><b>'+eur(c.loan)+'</b><span>Finanziamento agevolato lordo</span></div><div><b>'+eur(c.own)+'</b><span>Quota da coprire con altre risorse</span></div><div><b>'+eur2(c.m)+'</b><span>Rata mensile media su '+c.years+' anni</span></div><div><b>'+eur(c.interest)+'</b><span>Interessi totali stimati</span></div></div>';
  h+='<div class="panel"><h3>Ipotesi e limiti</h3><ul style="margin:8px 0 0;padding-left:20px"><li>Rimborso con rate mensili costanti e tasso fisso; nei finanziamenti agevolati reali le rate sono spesso semestrali e possono avere preammortamento.</li><li>Il calcolo non verifica le spese ammissibili né l\'esito della valutazione.</li><li>Ogni aiuto pubblico può contare nel limite de minimis (indicato come 300.000 euro in tre anni nel regime generale: da verificare con la norma in vigore). Controlla anche la cumulabilità tra misure.</li><li>Nessuna consulenza fiscale o legale.</li>'+c.notes.map(function(n){return '<li><b>'+esc(n)+'</b></li>';}).join("")+'</ul></div>';
  return h;
}
function favView(){
  var h='<h2>Preferiti e scadenze</h2><div class="banner"><b>Promemoria.</b> Questa pagina non invia notifiche: mostra solo l\'elenco ordinato per scadenza quando la apri. I preferiti restano nel browser di questo dispositivo, se il browser lo consente, e non si sincronizzano.</div>';
  if(!state.fav.length)return h+'<div class="empty">Non hai preferiti. Usa «Aggiungi ai preferiti» su una misura.</div>';
  var rs=state.fav.map(byId).filter(Boolean).sort(function(a,b){var da=a.close?daysTo(a.close):99999,db=b.close?daysTo(b.close):99999;return da-db;});
  h+='<div class="list">';
  rs.forEach(function(r){var d=r.close?daysTo(r.close):null;var dtxt=d==null?'<span class="nv">nessuna scadenza nota</span>':(d<0?'scaduta il '+fmt(r.close):(d===0?'scade oggi':'mancano '+d+' giorni ('+fmt(r.close)+')'))+(r.evidence!=="ufficiale"?' <span class="nv">(data non verificata)</span>':'');
   h+='<div class="card"><h3><button class="link" data-open="'+r.id+'">'+esc(r.name)+'</button></h3><div>'+stPill(effStatus(r))+'</div><div class="meta"><span>Scadenza: '+dtxt+'</span><span>'+(r.lastVerified?'Verificata il '+fmt(r.lastVerified):'Mai verificata su fonte ufficiale')+'</span></div><div class="acts"><button class="btn small" data-fav="'+r.id+'">Rimuovi dai preferiti</button></div></div>';});
  h+='</div><div class="panel"><div class="sec-h"><h3>Esporta i preferiti</h3></div><div class="searchrow"><button class="btn small" data-exp="favcsv">Copia CSV</button><button class="btn small" data-exp="favjson">Copia JSON</button></div><textarea class="exp" id="exp-out" readonly hidden aria-label="Testo esportato"></textarea></div>';
  return h;
}
function infoView(){
  var gaps=DB.filter(function(r){return r.evidence!=="ufficiale";}).length;
  return '<h2>Metodo, fonti e limiti</h2>'+
  '<section class="panel"><h3>Stato dei dati</h3><p style="margin-top:6px">Aggiornamento del '+fmt(DATA_DATE)+'. Misure totali: '+DB.length+'. Con pagina ufficiale consultata: '+(DB.length-gaps)+'. Solo fonti secondarie: '+gaps+'. Un campo mancante è scritto «non verificato», mai riempito per deduzione.</p></section>'+
  '<section class="panel"><h3>Significato degli stati</h3><ul style="margin:8px 0 0;padding-left:20px"><li>'+stPill("APERTO")+' Fonte ufficiale letta e verifica entro '+STALE_DAYS+' giorni.</li><li>'+stPill("CHIUSO")+' Finestra conclusa secondo la fonte indicata.</li><li>'+stPill("ANNUNCIATA")+' Apertura comunicata con data futura.</li><li>'+stPill("ATTESA_EDIZIONE")+' Edizione conclusa, nuova edizione attesa ma non datata.</li><li>'+stPill("DA_VERIFICARE")+' Fonte non ufficiale, verifica scaduta o dati in conflitto.</li></ul></section>'+
  '<section class="panel"><h3>Procedura di revisione periodica</h3><ol style="margin:8px 0 0;padding-left:20px"><li>Ogni 2 settimane riapri la pagina ufficiale di ogni misura con stato Aperto o Annunciata e aggiorna stato e data di verifica.</li><li>Ogni mese controlla i portali Invitalia, MIMIT, GSE, ISMEA, Regione Abruzzo e FiRA, Camera di commercio, Commissione europea per nuove edizioni.</li><li>Aggiungi una nuova edizione come record separato, con il suo identificativo, senza modificare la precedente.</li><li>Prima di inserire una misura cerca duplicati per nome, ente e edizione.</li><li>Per ogni campo importo, requisito e scadenza copia solo ciò che la fonte ufficiale riporta, altrimenti scrivi «non verificato».</li><li>Controlla cumulabilità e de minimis sul bando o sull\'avviso.</li></ol></section>'+
  '<section class="panel"><h3>Cosa questa app non fa</h3><ul style="margin:8px 0 0;padding-left:20px"><li>Non è collegata a fonti in tempo reale: i dati sono quelli incorporati nella pagina alla data indicata.</li><li>Non invia notifiche o email: i promemoria sono un elenco ordinato per scadenza.</li><li>Non scarica file: l\'esportazione avviene copiando il testo.</li><li>I preferiti dipendono dalla memoria del browser e non seguono te tra dispositivi.</li><li>Non dà consulenza fiscale o legale e non garantisce l\'ammissione a nessuna misura.</li><li>Le pagine ufficiali di altre misure e le fonti secondarie non sono state riaperte per questa versione: i link con la dicitura «non verificato» possono essere cambiati.</li></ul></section>'+
  '<section class="panel"><h3>Criteri della compatibilità</h3><p style="margin-top:6px">Per ogni misura si controllano: stato aperto e verificato, territorio, e i requisiti elencati nella scheda (età, condizione occupazionale, impresa esistente, azienda agricola, startup, compagine). Ogni criterio è «soddisfatto», «da verificare» o «mancante». Lo stato lavorativo, l\'impresa e la disponibilità di capitale non sono mai dedotti: se non li dichiari risultano «da verificare».</p></section>'+
  '<section class="panel"><h3>Fonti ufficiali consultate</h3><ul style="margin:8px 0 0;padding-left:20px">'+
  [["Invitalia – Resto al Sud 2.0","https://www.invitalia.it/incentivi-e-strumenti/resto-al-sud-20"],["Invitalia – ON","https://www.invitalia.it/incentivi-e-strumenti/ON-nuove-imprese-tasso-zero"],["Invitalia – Smart&Start Italia","https://www.invitalia.it/incentivi-e-strumenti/smartstart-italia"],["Invitalia – Autoimpiego Centro-Nord","https://www.invitalia.it/incentivi-e-strumenti/autoimpiego-centro-nord"],["MIMIT – Nuova Sabatini","https://www.mimit.gov.it/it/incentivi/agevolazioni-per-gli-investimenti-delle-pmi-in-beni-strumentali-nuova-sabatini"],["Regione Abruzzo – Micro Prestiti","https://coesione.regione.abruzzo.it/avvisi-pubblici/fse/avviso-unico-abruzzo-micro-prestiti"],["FiRA – Micro Prestiti","https://www.fira.it/fira-avviso-unico-abruzzo-micro-prestiti-apertura-maggio-2026chiusura-fino-a-esaurimento-risorse/"]].map(function(u){return '<li><a href="'+u[1]+'" target="_blank" rel="noopener noreferrer">'+u[0]+'</a></li>';}).join("")+'</ul></section>';
}
function exportText(kind){
  var rows=(kind.indexOf("fav")===0? state.fav.map(byId).filter(Boolean) : applyFilters().map(function(x){return x.r;}));
  if(kind.indexOf("json")>=0)return JSON.stringify(rows.map(function(r){return {id:r.id,nome:r.name,ente:r.body,stato:STATUS[effStatus(r)].l,scadenza:r.close||null,ultima_verifica:r.lastVerified||null,fonte:r.evidence,url:r.urls.map(function(u){return u.url;})};}),null,2);
  function q(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}
  var lines=["id;nome;ente;tipo_aiuto;stato;scadenza;ultima_verifica;fonte;url"];
  rows.forEach(function(r){lines.push([r.id,r.name,r.body,r.aid.map(function(a){return AID[a];}).join(" / "),STATUS[effStatus(r)].l,r.close||"non indicata",r.lastVerified||"mai verificata",r.evidence,r.urls[0]?r.urls[0].url:""].map(q).join(";"));});
  return lines.join("\n");
}

/* ===================== ROUTING & EVENTS ===================== */
var main=document.getElementById("main");
function render(){
  renderTabs();
  var h="";
  if(state.view==="home")h=home();else if(state.view==="search")h=searchView();else if(state.view==="detail")h=detail();else if(state.view==="compare")h=compareView();else if(state.view==="sim")h=simView();else if(state.view==="fav")h=favView();else h=infoView();
  main.innerHTML=h;
  document.getElementById("foot").innerHTML="Funding Radar Italia. Dati aggiornati al "+fmt(DATA_DATE)+". Strumento informativo: non è consulenza fiscale o legale e non garantisce l'ammissione ad alcuna misura. Verifica sempre il bando ufficiale.";
}
function go(v){state.view=v;render();window.scrollTo(0,0);}
function resetFilters(){state.f={benef:[],act:[],aid:[],reg:"",status:"",dl:"",evid:false,fp:false,tz:false,lowcap:false,fit:false,cat:""};state.q="";}
function toggle(arr,v,on){var i=arr.indexOf(v);if(on&&i<0)arr.push(v);if(!on&&i>=0)arr.splice(i,1);}
document.addEventListener("click",function(e){
  var t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.open){state.detail=t.dataset.open;state.view="detail";render();window.scrollTo(0,0);return;}
  if(t.dataset.cat){resetFilters();state.f.cat=t.dataset.cat;go("search");return;}
  if(t.dataset.quick){var k=t.dataset.quick;resetFilters();if(k==="evid")state.f.evid=true;if(k==="open")state.f.status="APERTO";if(k==="ann")state.f.status="ANNUNCIATA";if(k==="att")state.f.status="ATTESA_EDIZIONE";if(k==="imm")state.f.dl="45";if(k==="fit")state.f.fit=true;
    go("search");return;}
  if(t.dataset.fav){var id=t.dataset.fav,i=state.fav.indexOf(id);if(i>=0)state.fav.splice(i,1);else state.fav.push(id);saveFav();toast(i>=0?"Rimosso dai preferiti":"Aggiunto ai preferiti");render();return;}
  if(t.dataset.cmpadd){addCmp(t.dataset.cmpadd);renderTabs();return;}
  if(t.dataset.cmpdel){state.cmp=state.cmp.filter(function(x){return x!==t.dataset.cmpdel;});render();return;}
  if(t.dataset.rm){var k2=t.dataset.rm.split(":"),f=state.f;
    if(k2[0]==="q")state.q="";else if(k2[0]==="cat")f.cat="";else if(k2[0]==="benef"||k2[0]==="act"||k2[0]==="aid")toggle(f[k2[0]],k2[1],false);else if(["reg","status","dl"].indexOf(k2[0])>=0)f[k2[0]]="";else f[k2[0]]=false;
    render();return;}
  if(t.dataset.exp){var ta=document.getElementById("exp-out"),txt=exportText(t.dataset.exp);ta.value=txt;ta.hidden=false;
    var done=function(){toast("Testo copiato negli appunti");};
    var fb=function(){ta.focus();ta.select();toast("Selezionato: premi Ctrl+C o Cmd+C per copiare");};
    try{navigator.clipboard.writeText(txt).then(done,fb);}catch(err){fb();}
    return;}
  var a=t.dataset.act;
  if(a==="reset"){resetFilters();render();}
  else if(a==="clearcmp"){state.cmp=[];render();}
  else if(a==="theme"){var root=document.documentElement,dark=root.getAttribute("data-theme")==="dark"||(root.getAttribute("data-theme")!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);root.setAttribute("data-theme",dark?"light":"dark");}
});
function addCmp(id){if(state.cmp.indexOf(id)>=0){toast("Già nel confronto");return;}if(state.cmp.length>=4){toast("Massimo 4 misure nel confronto");return;}state.cmp.push(id);toast("Aggiunto al confronto");}
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.cmp){if(t.checked){if(state.cmp.length>=4&&state.cmp.indexOf(t.dataset.cmp)<0){t.checked=false;toast("Massimo 4 misure nel confronto");return;}if(state.cmp.indexOf(t.dataset.cmp)<0)state.cmp.push(t.dataset.cmp);}else state.cmp=state.cmp.filter(function(x){return x!==t.dataset.cmp;});renderTabs();return;}
  if(t.dataset.fk){toggle(state.f[t.dataset.fk],t.value,t.checked);refreshResults();return;}
  if(t.dataset.fb){state.f[t.dataset.fb]=t.checked;refreshResults();return;}
  if(t.id==="s-reg"){state.f.reg=t.value;refreshResults();return;}
  if(t.id==="s-st"){state.f.status=t.value;refreshResults();return;}
  if(t.id==="s-dl"){state.f.dl=t.value;refreshResults();return;}
  if(t.id==="s-sort"){state.sort=t.value;refreshResults();return;}
  var pm={"p-region":["region"],"p-emp":["employment"],"p-comp":["company"],"p-farm":["farm"],"p-act":["activity"]};
  if(pm[t.id]){profile[pm[t.id][0]]=t.value;render();return;}
  if(t.id==="p-age"){profile.age=t.value===""?"":Number(t.value);render();return;}
  if(t.id==="m-preset"){state.sim.preset=t.value;render();return;}
  if(t.id==="m-sudfp"){state.sim.sudfp=t.checked;render();return;}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="s-q"){state.q=t.value;refreshResults();return;}
  var sm={"m-inv":"inv","m-fp":"fp","m-loan":"loan","m-rate":"rate","m-years":"years"};
  if(sm[t.id]){state.sim[sm[t.id]]=t.value;var pos=t.id;var out=document.querySelector(".out"),pan=out&&out.nextElementSibling;var c=simCalc(state.sim);
    var tmp=document.createElement("div");tmp.innerHTML=simView();var newOut=tmp.querySelector(".out"),newPan=tmp.querySelector(".out+.panel");if(out&&newOut){out.innerHTML=newOut.innerHTML;if(pan&&newPan)pan.innerHTML=newPan.innerHTML;}}
});
document.addEventListener("submit",function(e){
  if(e.target.id==="homeSearch"){e.preventDefault();var v=document.getElementById("hq").value;resetFilters();state.q=v;go("search");}
});
render();
</script>
